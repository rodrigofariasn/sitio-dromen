name: Publicar en freehost.cl
# Un push a main solo hace una prueba (dry-run): se conecta y lista cambios, sin subir nada.
# Para reemplazar archivos en el hosting: Actions > Run workflow > modo "publicar".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      modo:
        description: "prueba = no sube nada; publicar = reemplaza archivos en el hosting"
        type: choice
        options: [prueba, publicar]
        default: prueba
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          dry-run: ${{ inputs.modo != 'publicar' }}
          exclude: |
            **/.git*
            **/.git*/**
            .claude/**
            .github/**
