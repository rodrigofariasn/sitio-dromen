name: Prueba de despliegue (no sube nada)
# Se conecta por FTP y lista lo que se subiría, sin modificar el hosting.
# Para publicar de verdad usar el flujo "Publicar en freehost.cl" (publicar.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          dry-run: true
          exclude: |
            **/.git*
            **/.git*/**
            .claude/**
            .github/**
