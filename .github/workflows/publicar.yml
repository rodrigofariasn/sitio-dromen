name: Publicar en freehost.cl
# Se ejecuta al subir una etiqueta "publicar-*" (desde Claude, con autorización del usuario)
# o manualmente (Actions > Publicar en freehost.cl > Run workflow).
# Sube los cambios a /home/dromencl/public_html y reemplaza los archivos con el mismo nombre.
on:
  push:
    tags: ['publicar-*']
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            .claude/**
            .github/**
